// ─── Analysis engine ──────────────────────────────────────────────────────────
function analyze(text) {
  if (!text || text.trim().length < 2) return null;
  const hits = [];
  Object.entries(WORD_MAP).forEach(([word, rule]) => {
    if (text.includes(word)) hits.push({word, ...rule});
  });
  const grouped = {};
  hits.forEach(h => {
    if (!grouped[h.category]) grouped[h.category] = {category:h.category, level:h.level, ref:h.ref, refUrl:h.refUrl, advice:h.advice, words:[]};
    grouped[h.category].words.push(h.word);
  });
  const issues = Object.values(grouped);
  const highRisk = hits.filter(h => h.level === "极高风险" || h.level === "高风险").length;
  const score = Math.max(15, Math.min(96, 100 - highRisk * 18 - (hits.length - highRisk) * 7));
  const industryWarnings = INDUSTRY_SENSITIVE.filter(ind => ind.keywords.some(kw => text.includes(kw)));
  return {score, issues, hitCount:hits.length, industryWarnings};
}

function highlightText(text, issues) {
  if (!issues || issues.length === 0) return [{t:"text",c:text}];
  const allWords = issues.flatMap(i => i.words).sort((a,b) => b.length - a.length);
  const parts = []; let rem = text;
  for (let s = 0; rem.length > 0 && s < 2000; s++) {
    let earliest = -1, found = null;
    for (const w of allWords) {
      const idx = rem.indexOf(w);
      if (idx !== -1 && (earliest === -1 || idx < earliest)) {earliest=idx; found=w;}
    }
    if (!found) {parts.push({t:"text",c:rem}); break;}
    if (earliest > 0) parts.push({t:"text",c:rem.slice(0,earliest)});
    parts.push({t:"hit",c:found,meta:WORD_MAP[found]});
    rem = rem.slice(earliest+found.length);
  }
  return parts;
}

function AuthModal({onClose, onLogin}) {
  const [phone,setPhone] = useState("");
  const [code,setCode]   = useState("");
  const [cd,setCd]       = useState(0);
  const [msg,setMsg]     = useState("");
  const [ok,setOk]       = useState(false);
  const timerRef         = useRef(null);

  useEffect(() => () => { if(timerRef.current) clearInterval(timerRef.current); }, []);

  function sendCode() {
    if (!/^1[3-9]\d{9}$/.test(phone)) {setMsg("请输入正确的手机号");setOk(false);return;}
    if (timerRef.current) clearInterval(timerRef.current);
    setCd(60); setMsg("验证码已发送（演示：6688）"); setOk(true);
    timerRef.current = setInterval(() => setCd(c => {if(c<=1){clearInterval(timerRef.current);return 0;}return c-1;}),1000);
  }
  function submit() {
    if (!phone.trim()) {setMsg("请先输入手机号");setOk(false);return;}
    if (code!=="6688") {setMsg("验证码错误，演示验证码为 6688");setOk(false);return;}
    const users = ls("xhs_users",{});
    users[phone] = users[phone] || {avatar:phone.slice(-4)};
    lsSet("xhs_users",users);
    onLogin({phone, avatar:users[phone].avatar});
  }

  return (
    <div
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",zIndex:999,backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)"}}

    >
      <div style={{width:"100%",maxWidth:480,margin:"0 auto",background:"#fff",borderRadius:"24px 24px 0 0",padding:"12px 24px 48px",boxSizing:"border-box"}}>
        <div style={{width:36,height:4,borderRadius:2,background:C.border,margin:"0 auto 20px"}} />
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <h2 style={{margin:"0 0 3px",fontSize:20,fontWeight:800,color:C.text1}}>登录 / 注册</h2>
            <p style={{margin:0,fontSize:13,color:C.text3}}>演示验证码：6688，输入任意手机号即可</p>
          </div>
          <button onClick={onClose} style={{border:"none",background:C.bg,width:32,height:32,borderRadius:"50%",fontSize:16,cursor:"pointer",color:C.text3,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
        </div>

        {/* Phone */}
        <div style={{display:"flex",alignItems:"center",border:`1.5px solid ${C.border}`,borderRadius:12,overflow:"hidden",background:C.bg,marginBottom:10}}>
          <span style={{padding:"0 14px",fontSize:15,color:C.text3,borderRight:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>+86</span>
          <input
            value={phone} onChange={e=>setPhone(e.target.value)}
            placeholder="请输入手机号" type="tel"
            onKeyDown={e=>e.key==="Enter"&&sendCode()}
            style={{flex:1,padding:"14px",border:"none",background:"transparent",fontSize:15,outline:"none",color:C.text1}}
          />
        </div>

        {/* Code row */}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input
            value={code} onChange={e=>setCode(e.target.value)}
            placeholder="验证码" type="text" inputMode="numeric" maxLength={6}
            onKeyDown={e=>e.key==="Enter"&&submit()}
            style={{flex:1,padding:"14px",border:`1.5px solid ${C.border}`,borderRadius:12,fontSize:15,outline:"none",background:C.bg,color:C.text1}}
          />
          <button onClick={sendCode} disabled={cd>0}
            style={{whiteSpace:"nowrap",padding:"0 16px",background:cd>0?"#f0f0f0":C.red,color:cd>0?"#aaa":"#fff",border:"none",borderRadius:12,fontSize:13,fontWeight:700,cursor:cd>0?"default":"pointer",minWidth:96}}>
            {cd>0?`${cd}s`:"获取验证码"}
          </button>
        </div>

        {msg && <p style={{color:ok?"#00896C":C.red,fontSize:13,margin:"0 0 12px",fontWeight:500}}>{msg}</p>}

        <button onClick={submit} disabled={!code||!phone}
          style={{width:"100%",padding:15,background:(!code||!phone)?"#f0f0f0":C.red,color:(!code||!phone)?"#bbb":"#fff",border:"none",borderRadius:14,fontSize:16,fontWeight:800,cursor:(!code||!phone)?"default":"pointer",transition:"all .2s"}}>

    </div>
  );

                  <div key={i} style={{background:"rgba(255,255,255,0.9)",borderRadius:10,padding:"10px 12px",marginBottom:i<result.issues.length-1?8:0}}>

                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
                      {issue.words.map(w=><Pill key={w} style={{background:isDanger?"#FFD7DC":"#FFF3E0",color:isDanger?C.red:"#BF360C"}}>{w}</Pill>)}
                    </div>
                    <a href={issue.refUrl} target="_blank" rel="noreferrer" style={{fontSize:11,color:C.red,textDecoration:"none"}}>🔗 {issue.ref}</a>
                  </div>

              </Card>
              <Card style={{marginBottom:12}}>
                <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800,color:C.text1}}>💡 解决违规建议</p>

                  <div key={i} style={{marginBottom:i<result.issues.length-1?14:0}}>
                    <p style={{margin:"0 0 7px",fontSize:12,fontWeight:700,color:C.red}}>针对：{issue.category}</p>

                      <div key={j} style={{display:"flex",gap:8,marginBottom:6,padding:"8px 10px",background:C.bg,borderRadius:8,borderLeft:`3px solid ${AIC[adv.type]}`}}>

                        <div>

              </Card>
              {parts.length > 0 && (
                <Card>
                  <p style={{margin:"0 0 10px",fontSize:12,fontWeight:700,color:C.text3,letterSpacing:.4}}>原文标注预览</p>
                  <div style={{fontSize:14,lineHeight:2,color:C.text1,wordBreak:"break-all"}}>
                    {parts.map((p,i)=>p.t==="text"?<span key={i}>{p.c}</span>:
                      <span key={i} style={{background:p.meta.level==="极高风险"?C.red:p.meta.level==="高风险"?C.orange:C.yellow,color:"#fff",borderRadius:4,padding:"1px 4px",fontWeight:700,fontSize:12,margin:"0 1px"}}>{p.c}</span>
                    )}
                  </div>
                </Card>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function HomeTab({user, onNeedLogin}) {
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  function doAnalyze() {
    if (!user) {onNeedLogin(); return;}
    if (!text.trim()) return;
    setLoading(true);
    setTimeout(() => {
      const r = analyze(text);
      setResult(r);
      if (r) {
        const recs = ls(KEYS.RECORDS,[]);
        recs.unshift({id:Date.now(), time:new Date().toLocaleString("zh-CN"), text:text.slice(0,80), score:r.score, hitCount:r.hitCount, result:r, fullText:text});
        lsSet(KEYS.RECORDS, recs.slice(0,60));
      }
      setLoading(false);
    }, 500);
  }

  const parts = result ? highlightText(text, result.issues) : [];
  const isClean = result && result.hitCount===0 && result.industryWarnings.length===0;
  const isDanger = result && result.hitCount>0 && result.score<60;
  const scoreColor = !result?C.text4:result.score>=75?C.green:result.score>=50?C.yellow:C.red;

  return (
    <div style={{paddingBottom:24}}>

          {loading?"检测中…":"立即检测"}

// ─── Industry Tab ─────────────────────────────────────────────────────────────
function IndustryTab({user, onNeedLogin}) {
  const [selected, setSelected] = useState(null);
  const [favorites, setFavorites] = useState(() => ls(KEYS.FAVORITES,[]));
  const [search, setSearch] = useState("");

  function toggleFav(req) {
    if (!user) {onNeedLogin(); return;}
    const next = favorites.some(f=>f.id===req.id)?favorites.filter(f=>f.id!==req.id):[...favorites,req];
    setFavorites(next); lsSet(KEYS.FAVORITES,next);
  }
  const isFav = id => favorites.some(f=>f.id===id);
  const industry = selected ? INDUSTRIES.find(i=>i.id===selected) : null;
  const filtered = INDUSTRIES.filter(ind => !search || ind.name.includes(search) || ind.requirements.some(r=>r.title.includes(search)||r.desc.includes(search)));

  return (
    <div style={{paddingBottom:24}}>
      <HeroHeader tag="COMPLIANCE" title="行业合规" subtitle="各行业小红书发布规范 · 点击❤️收藏常用条款" />

      <div style={{padding:"12px 16px 6px",position:"sticky",top:0,background:C.bg,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",background:C.card,borderRadius:12,padding:"0 14px",border:`1px solid ${C.border}`,boxShadow:"0 1px 6px rgba(0,0,0,0.04)"}}>
          <span style={{fontSize:14,color:C.text4,marginRight:8}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索行业或关键词…"
            style={{flex:1,padding:"12px 0",border:"none",background:"transparent",fontSize:14,outline:"none",color:C.text1}} />
          {search&&<button onClick={()=>setSearch("")} style={{border:"none",background:"none",color:C.text4,cursor:"pointer",fontSize:14}}>✕</button>}
        </div>
      </div>

      {!selected ? (
        <div style={{padding:"8px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {filtered.map(ind=>(
              <button key={ind.id} onClick={()=>setSelected(ind.id)}
                style={{border:"none",borderRadius:16,padding:"18px 14px 16px",cursor:"pointer",textAlign:"left",background:C.card,boxShadow:"0 1px 10px rgba(0,0,0,0.05)",position:"relative",overflow:"hidden"}}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:ind.color,borderRadius:"16px 16px 0 0"}} />
                <div style={{fontSize:26,marginBottom:8}}>{ind.icon}</div>
                <div style={{fontWeight:800,fontSize:14,color:C.text1,marginBottom:3}}>{ind.name}</div>
                <div style={{fontSize:11,color:C.text4}}>{ind.requirements.length} 条规范</div>
              </button>
            ))}
          </div>
        </div>
      ) : (
        <div style={{padding:"0 16px"}}>
          <button onClick={()=>setSelected(null)}
            style={{display:"flex",alignItems:"center",gap:6,border:"none",background:"none",color:C.red,fontSize:14,fontWeight:700,padding:"14px 0",cursor:"pointer"}}>
            ← 返回列表
          </button>
          <Card style={{marginBottom:14,borderTop:`4px solid ${industry.color}`}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:44,height:44,borderRadius:12,background:industry.color+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{industry.icon}</div>
              <div>
                <h3 style={{margin:0,fontSize:16,fontWeight:800,color:C.text1}}>{industry.name}</h3>
                <p style={{margin:"2px 0 0",fontSize:11,color:C.text3}}>{industry.requirements.length} 条合规规范 · 2025-2026</p>
              </div>
            </div>
          </Card>
          {industry.requirements.map(req=>(
            <Card key={req.id} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
                  <LevelBadge level={req.level} />
                  <span style={{fontSize:13,fontWeight:800,color:C.text1,lineHeight:1.4}}>{req.title}</span>
                </div>
                <button onClick={()=>toggleFav(req)}
                  style={{border:"none",background:"none",fontSize:18,cursor:"pointer",color:isFav(req.id)?C.red:"#ddd",padding:"0 0 0 8px",flexShrink:0}}>
                  {isFav(req.id)?"❤️":"🤍"}
                </button>
              </div>
              <p style={{margin:"0 0 8px",fontSize:12,color:C.text2,lineHeight:1.7}}>{req.desc}</p>
              {req.refUrl&&<a href={req.refUrl} target="_blank" rel="noreferrer" style={{fontSize:11,color:C.red,textDecoration:"none"}}>🔗 {req.ref}</a>}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Profile Tab ──────────────────────────────────────────────────────────────
// FIX: records and favorites now read fresh from localStorage on every render
// via useEffect, so they update after login/new detection without re-mounting.
function ProfileTab({user, onLogout, setShowAuth}) {
  const [tab, setTab]               = useState("records");
  const [records, setRecords]       = useState([]);
  const [favorites, setFavorites]   = useState([]);
  const [selectedRecord, setSelectedRecord] = useState(null);
  const [favSelecting, setFavSelecting]     = useState(false);
  const [favSelected, setFavSelected]       = useState([]);

  // Always read fresh data when tab becomes visible or user changes
  useEffect(() => {
    setRecords(ls(KEYS.RECORDS,[]));
    setFavorites(ls(KEYS.FAVORITES,[]));
  }, [user]);

  // Also refresh when the sub-tab switches (user may have added records)
  useEffect(() => {
    setRecords(ls(KEYS.RECORDS,[]));
    setFavorites(ls(KEYS.FAVORITES,[]));
  }, [tab]);

  function toggleFavSelect(id) {
    setFavSelected(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }
  function deleteSelectedFavs() {
    const next = favorites.filter(f=>!favSelected.includes(f.id));
    setFavorites(next); lsSet(KEYS.FAVORITES,next);
    setFavSelected([]); setFavSelecting(false);
  }
  function selectAll() {
    setFavSelected(favSelected.length===favorites.length?[]:favorites.map(f=>f.id));
  }

  const scoreColor = s => s>=75?C.green:s>=55?C.yellow:C.red;
  const scoreBg    = s => s>=75?C.greenBg:s>=55?"#FFFDE7":C.redBg;

  return (
    <div style={{paddingBottom:24}}>
      {selectedRecord && <ResultModal record={selectedRecord} onClose={()=>setSelectedRecord(null)} />}

      {/* Header */}
      <div style={{background:`linear-gradient(150deg,${C.redDark} 0%,${C.red} 100%)`,padding:"32px 20px 24px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-40,right:-40,width:130,height:130,borderRadius:"50%",background:"rgba(255,255,255,0.06)"}} />
        {user ? (
          <>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
              <div style={{width:52,height:52,borderRadius:15,background:"rgba(255,255,255,0.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:900,color:"#fff",border:"2px solid rgba(255,255,255,0.28)",flexShrink:0}}>
                {user.avatar}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <p style={{margin:0,fontSize:16,fontWeight:800,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.phone}</p>
                <p style={{margin:"3px 0 0",fontSize:12,color:"rgba(255,255,255,0.65)"}}>已登录</p>
              </div>
              <button onClick={onLogout}
                style={{border:"1.5px solid rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.1)",color:"#fff",padding:"7px 14px",borderRadius:20,fontSize:12,cursor:"pointer",flexShrink:0}}>
                退出
              </button>
            </div>
            <div style={{display:"flex",gap:8}}>
              {[["📋","检测记录",records.length],["❤️","我的收藏",favorites.length]].map(([icon,label,count])=>(
                <div key={label} style={{flex:1,background:"rgba(255,255,255,0.13)",borderRadius:12,padding:"10px 12px"}}>
                  <p style={{margin:"0 0 2px",fontSize:11,color:"rgba(255,255,255,0.65)"}}>{icon} {label}</p>
                  <p style={{margin:0,fontSize:20,fontWeight:900,color:"#fff"}}>{count}</p>
                </div>
              ))}
            </div>
          </>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:52,height:52,borderRadius:15,background:"rgba(255,255,255,0.14)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,border:"2px solid rgba(255,255,255,0.2)",flexShrink:0}}>
              👤
            </div>
            <div style={{flex:1}}>
              <p style={{margin:0,fontSize:18,fontWeight:800,color:"#fff"}}>未登录</p>
              <p style={{margin:"3px 0 0",fontSize:12,color:"rgba(255,255,255,0.65)"}}>登录后查看检测记录与收藏</p>
            </div>
            <button onClick={()=>setShowAuth(true)}
              style={{background:"#fff",color:C.red,border:"none",padding:"10px 20px",borderRadius:20,fontSize:13,fontWeight:800,cursor:"pointer",flexShrink:0,boxShadow:"0 2px 8px rgba(0,0,0,0.12)"}}>
              立即登录
            </button>
          </div>
        )}
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",background:C.card,borderBottom:`1px solid ${C.border}`}}>
        {[["records","检测记录"],["favorites","我的收藏"]].map(([t,l])=>(
          <button key={t} onClick={()=>setTab(t)}
            style={{flex:1,border:"none",background:"none",padding:"13px 0",fontSize:13,fontWeight:tab===t?800:400,color:tab===t?C.red:C.text3,borderBottom:`2.5px solid ${tab===t?C.red:"transparent"}`,cursor:"pointer",transition:"color .15s"}}>
            {l}
          </button>
        ))}
      </div>

      <div style={{padding:"12px 16px"}}>
        {tab==="records" ? (
          records.length===0
            ? <EmptyState icon="📋" text={user?"暂无检测记录，去检测一下吧":"登录后查看检测历史"} />
            : records.map(r=>(
              <div key={r.id} onClick={()=>setSelectedRecord(r)}
                style={{background:C.card,borderRadius:14,padding:"13px 16px",marginBottom:9,boxShadow:"0 1px 8px rgba(0,0,0,0.04)",display:"flex",alignItems:"center",gap:12,cursor:"pointer",transition:"box-shadow .15s"}}
                onMouseEnter={e=>e.currentTarget.style.boxShadow="0 3px 14px rgba(0,0,0,0.09)"}
                onMouseLeave={e=>e.currentTarget.style.boxShadow="0 1px 8px rgba(0,0,0,0.04)"}
              >
                <div style={{width:44,height:44,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:scoreBg(r.score)}}>
                  <span style={{fontSize:14,fontWeight:900,color:scoreColor(r.score)}}>{r.score}</span>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{margin:0,fontSize:13,fontWeight:600,color:C.text1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.text}</p>
                  <p style={{margin:"3px 0 0",fontSize:11,color:C.text3}}>{r.time} · {r.hitCount>0?`${r.hitCount}处风险`:"合规"}</p>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:scoreColor(r.score)}} />
                  <span style={{fontSize:16,color:C.text4}}>›</span>
                </div>
              </div>
            ))
        ) : (
          <>
            {favorites.length>0 && (
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                {favSelecting ? (
                  <>
                    <button onClick={selectAll} style={{border:"none",background:"none",color:C.red,fontSize:13,fontWeight:700,cursor:"pointer"}}>
                      {favSelected.length===favorites.length?"取消全选":"全选"}
                    </button>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={deleteSelectedFavs} disabled={favSelected.length===0}
                        style={{padding:"6px 16px",background:favSelected.length===0?"#f0f0f0":C.red,color:favSelected.length===0?"#aaa":"#fff",border:"none",borderRadius:20,fontSize:12,fontWeight:700,cursor:favSelected.length===0?"default":"pointer"}}>
                        删除({favSelected.length})
                      </button>
                      <button onClick={()=>{setFavSelecting(false);setFavSelected([]);}}
                        style={{padding:"6px 14px",background:"#f0f0f0",color:C.text2,border:"none",borderRadius:20,fontSize:12,cursor:"pointer"}}>
                        取消
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <span style={{fontSize:12,color:C.text3}}>共 {favorites.length} 条</span>
                    <button onClick={()=>setFavSelecting(true)} style={{border:"none",background:"none",color:C.red,fontSize:13,fontWeight:700,cursor:"pointer"}}>批量删除</button>
                  </>
                )}
              </div>
            )}
            {favorites.length===0
              ? <EmptyState icon="❤️" text="暂无收藏，去行业页面收藏规范" />
              : favorites.map(f=>(
                <div key={f.id} onClick={()=>favSelecting&&toggleFavSelect(f.id)}
                  style={{background:C.card,borderRadius:14,padding:"13px 16px",marginBottom:9,boxShadow:"0 1px 8px rgba(0,0,0,0.04)",cursor:favSelecting?"pointer":"default",outline:favSelecting&&favSelected.includes(f.id)?`2px solid ${C.red}`:"2px solid transparent"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    {favSelecting&&(
                      <div style={{width:18,height:18,borderRadius:"50%",border:`2px solid ${favSelected.includes(f.id)?C.red:"#ddd"}`,background:favSelected.includes(f.id)?C.red:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {favSelected.includes(f.id)&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}
                      </div>
                    )}
                    <LevelBadge level={f.level} />
                    <span style={{fontSize:13,fontWeight:800,color:C.text1,flex:1,minWidth:0}}>{f.title}</span>
                  </div>
                  <p style={{margin:"0 0 8px",fontSize:12,color:C.text2,lineHeight:1.7}}>{f.desc}</p>
                  {f.refUrl&&<a href={f.refUrl} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:11,color:C.red,textDecoration:"none"}}>🔗 {f.ref}</a>}
                </div>
              ))
            }
          </>
        )}
      </div>
    </div>
  );
}

function EmptyState({icon, text}) {
  return (
    <div style={{textAlign:"center",padding:"56px 20px",color:C.text4}}>
      <div style={{fontSize:46,marginBottom:12,opacity:.5}}>{icon}</div>
      <p style={{margin:0,fontSize:14,color:C.text3}}>{text}</p>
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState("home");
  const [user, setUser]         = useState(() => ls(KEYS.USER,null));
  const [showAuth, setShowAuth] = useState(false);

  function handleLogin(u)  { setUser(u); lsSet(KEYS.USER,u); setShowAuth(false); }
  function handleLogout()  { setUser(null); localStorage.removeItem(KEYS.USER); }

  const tabs = [
    {id:"home",     label:"检测", icon:"◈"},
    {id:"industry", label:"行业", icon:"✦"},
    {id:"profile",  label:"我的", icon:"◎"},
  ];

  return (
    <>
      <style>{`
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
        body{min-height:100%;background:${C.bg};-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:${C.text1};font-family:-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif}
        ::-webkit-scrollbar{display:none}
        input,textarea,button,select{font-family:inherit}
        button{-webkit-tap-highlight-color:transparent}
        a{-webkit-tap-highlight-color:transparent}
      `}</style>

      <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",maxWidth:480,margin:"0 auto",background:C.bg}}>
        <div style={{flex:1,paddingBottom:68}}>
          {tab==="home"     && <HomeTab     user={user} onNeedLogin={()=>setShowAuth(true)} />}
          {tab==="industry" && <IndustryTab user={user} onNeedLogin={()=>setShowAuth(true)} />}
          {tab==="profile"  && <ProfileTab  user={user} onLogout={handleLogout} setShowAuth={setShowAuth} />}
        </div>

        {/* Bottom nav */}
        <div style={{position:"sticky",bottom:0,background:"rgba(255,255,255,0.94)",borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100,backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)"}}>
          {tabs.map(t=>{
            const active = tab===t.id;
            return (
              <button key={t.id} onClick={()=>setTab(t.id)}
                style={{flex:1,border:"none",background:"none",padding:"9px 0 11px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative",WebkitTapHighlightColor:"transparent"}}>
                <span style={{fontSize:active?21:19,lineHeight:1,color:active?C.red:C.text4,transition:"all .18s",fontWeight:active?900:400}}>{t.icon}</span>
                <span style={{fontSize:10,fontWeight:active?800:400,color:active?C.red:C.text4,letterSpacing:.3,transition:"color .18s"}}>{t.label}</span>
                {active&&<div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:18,height:2,borderRadius:1,background:C.red}} />}
              </button>
            );
          })}
        </div>

        {showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} />}
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<script>
// ─── Register Service Worker (enables offline use) ────────────────────────
if ('serviceWorker' in navigator) {
  const swBlob = new Blob(["\nconst CACHE = 'xhs-compliance-v2';\nconst PRECACHE = [\n  'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',\n  'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',\n  'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js'\n];\n\nself.addEventListener('install', e => {\n  e.waitUntil(\n    caches.open(CACHE).then(c => c.addAll(PRECACHE)).then(() => self.skipWaiting())\n  );\n});\n\nself.addEventListener('activate', e => {\n  e.waitUntil(\n    caches.keys().then(keys =>\n      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))\n    ).then(() => self.clients.claim())\n  );\n});\n\nself.addEventListener('fetch', e => {\n  // Cache-first for CDN scripts, network-first for everything else\n  const url = e.request.url;\n  const isCDN = url.includes('cdnjs.cloudflare.com');\n  if (isCDN) {\n    e.respondWith(\n      caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {\n        const clone = res.clone();\n        caches.open(CACHE).then(c => c.put(e.request, clone));\n        return res;\n      }))\n    );\n  }\n});\n"], {type: 'application/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl, {scope: './'}
  ).then(reg => {
    console.log('[PWA] SW registered, scope:', reg.scope);
  }).catch(e => {
    console.warn('[PWA] SW registration failed:', e);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.body.classList.add('ready'), 100);
});
